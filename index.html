<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PBP 2027 · načrt</title>
<style>
:root{
  --paper:#E8ECE7; --card:#F5F7F3; --ink:#1C2540; --muted:#59627A; --line:#C3C9CF;
  --stamp:#8C2C4C; --hivis:#C9D600; --hivis-ink:#1C2540; --ok:#2E6A4E; --night:#D5DAE4;
  --ride:#1C2540; --stop:#8A93A8; --sleep:#8C2C4C;
  color-scheme:light;
  --cond:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#141A2A;--card:#1B2236;--ink:#E2E6EE;--muted:#98A1B5;--line:#2F3850;
  --stamp:#E0799A;--hivis:#D2DE2C;--hivis-ink:#141A2A;--ok:#7FC8A2;--night:#20283D;
  --ride:#C9D0DE;--stop:#5F6880;--sleep:#E0799A;color-scheme:dark}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:var(--cond);font-weight:700;line-height:1.15;margin:0}
h2{font-size:1.6rem;margin:0 0 .75rem}
h3{font-size:1.15rem;margin:1.5rem 0 .5rem}
.num,td,input[type=number]{font-variant-numeric:tabular-nums}
a{color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--paper)}
header.top .bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;flex-wrap:wrap}
header.top h1{font-size:1.5rem;letter-spacing:.01em}
header.top .count{font-family:var(--cond);font-size:1.05rem;opacity:.85}
header.top .spacer{flex:1}
.btn{font:inherit;font-size:.9rem;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:.3rem .85rem;cursor:pointer}
.btn.fill{background:var(--hivis);color:var(--hivis-ink);border-color:var(--hivis)}
.btn.small{font-size:.8rem;padding:.15rem .6rem}
.btn.danger{color:var(--stamp)}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--hivis);outline-offset:2px}
nav.tabs{display:flex;gap:.25rem;overflow-x:auto;max-width:1180px;margin:0 auto;padding:0 1rem;scrollbar-width:none}
nav.tabs button{font:600 .95rem var(--cond);background:none;border:0;color:var(--paper);opacity:.7;padding:.55rem .7rem;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{opacity:1;border-bottom-color:var(--hivis)}
.dirty{background:var(--hivis);color:var(--hivis-ink);font-size:.85rem;text-align:center;padding:.3rem 1rem}
main{max-width:1180px;margin:0 auto;padding:1.25rem 1rem 4rem}
.lead{color:var(--muted);max-width:70ch;margin:0 0 1rem}
.flag{display:inline-block;font-size:.78rem;border:1px dashed var(--stamp);color:var(--stamp);border-radius:4px;padding:0 .4rem;margin-left:.4rem;vertical-align:middle}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem}
.fields{display:grid;gap:.6rem 1rem;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.15rem}
input,select,textarea{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:.35rem .5rem;width:100%}
textarea{min-height:4.5rem;resize:vertical}
input[type=checkbox]{width:auto;accent-color:var(--ink)}
input:disabled,select:disabled,textarea:disabled{background:transparent;border-color:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1;padding-left:0;resize:none}
select:disabled{appearance:none}
body.read .edit-only{display:none!important}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table.t{border-collapse:collapse;width:100%;font-size:.88rem}
table.t th{font:600 .82rem var(--cond);text-align:left;color:var(--muted);padding:.5rem .45rem;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
table.t td{padding:.3rem .45rem;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td input,table.t td select{min-width:4.5rem;padding:.2rem .35rem}
table.t td.w input{min-width:10rem}
table.t tr.ph td:first-child{border-left:3px dashed var(--stamp)}
.badge{display:inline-block;border-radius:4px;padding:.05rem .45rem;font-size:.82rem;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--hivis);color:var(--hivis-ink)}
.badge.bad{background:var(--stamp);color:var(--paper)}
.badge.mid{border:1px solid var(--line);color:var(--muted)}
.stat{display:flex;flex-direction:column}
.stat b{font:700 2rem/1.1 var(--cond)}
.stat span{font-size:.82rem;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:1.5rem 2.5rem;margin:.5rem 0 1rem}
.hero{display:grid;grid-template-columns:auto 1fr;gap:1.5rem;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:1rem;margin-bottom:1.25rem}
.hero .days{font:800 clamp(4rem,14vw,8.5rem)/.85 var(--cond);letter-spacing:-.02em}
.hero .days small{display:block;font-size:1rem;font-weight:600;letter-spacing:0;margin-top:.4rem}
.hero p{margin:0;color:var(--muted)}
ul.clean{list-style:none;padding:0;margin:0}
ul.clean li{padding:.35rem 0;border-bottom:1px solid var(--line)}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.qual{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.qual div{border:2px solid var(--line);border-radius:8px;padding:.6rem;text-align:center;font:700 1.3rem var(--cond)}
.qual div.done{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.qual div small{display:block;font:500 .75rem var(--body);opacity:.8}
/* brevet card */
.card-grid{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}
.ctl{position:relative;background:var(--card);border:1.5px dashed var(--ink);border-radius:4px;padding:.9rem .9rem 1rem}
.ctl.passed{border-style:solid}
.ctl .no{font:800 2.4rem/1 var(--cond);opacity:.15;position:absolute;right:.7rem;top:.4rem}
.ctl h3{margin:0 0 .15rem;font-size:1.25rem;padding-right:3rem}
.ctl .km{color:var(--muted);font-size:.85rem}
.ctl .times{display:flex;gap:1.2rem;margin:.6rem 0}
.ctl .times b{font:700 1.5rem/1 var(--cond);display:block}
.ctl .times span{font-size:.75rem;color:var(--muted)}
.ctl ul{margin:.4rem 0 0;padding:0;list-style:none}
.ctl li label{display:flex;gap:.45rem;align-items:flex-start;font-size:.9rem;padding:.1rem 0}
.ctl .food{font-size:.88rem;margin-top:.5rem;padding-top:.5rem;border-top:1px solid var(--line)}
.ctl .live{margin-top:.6rem;display:flex;gap:.4rem;align-items:center}
.ctl .live input{font-size:.85rem}
.stampmark{position:absolute;right:.8rem;top:3rem;width:5.2rem;height:5.2rem;border:3px double var(--stamp);border-radius:50%;color:var(--stamp);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);font:700 1.05rem/1.05 var(--cond);text-align:center;background:color-mix(in srgb,var(--card) 80%,transparent)}
.stampmark small{font-size:.65rem;font-weight:600}
.crew{font-size:.8rem;font-weight:600}
.crew.no{color:var(--stamp)}
svg text{fill:var(--muted);font:11px var(--body)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:1rem;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:.8rem;height:.8rem;border-radius:2px;margin-right:.3rem;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .h{font:600 .8rem var(--cond);color:var(--muted);padding:.2rem}
.cal .d{min-height:5.2rem;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:.2rem .3rem;font-size:.75rem}
.cal .d.out{opacity:.35}
.cal .d.today{border-color:var(--ink);border-width:2px}
.cal .d .n{font-weight:700}
.cal .ev{display:block;border-radius:3px;padding:0 .25rem;margin-top:2px;background:var(--ink);color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.brevet{background:var(--hivis);color:var(--hivis-ink)}
.cal .ev.deadline{background:var(--stamp);color:var(--paper)}
.brev{margin-bottom:1rem}
.brev summary{cursor:pointer;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;font:600 1.05rem var(--cond)}
.note{font-size:.85rem;color:var(--muted)}
#map{height:62vh;min-height:360px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.mk{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font:700 13px var(--cond);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--ink)}
.mk.no{background:var(--stamp)}
.leaflet-popup-content{font:13px/1.4 var(--body)}
.msg{background:var(--card);border:1px solid var(--ink);border-radius:8px;padding:.5rem .8rem;margin-bottom:1rem}
.dirty .btn{border-color:var(--hivis-ink);margin-left:.6rem}
@media (max-width:640px){
  .hero{grid-template-columns:1fr}
  .qual div{font-size:1.05rem}
  .cal .d{min-height:3.6rem}
  .cal .ev{font-size:.65rem}
}
@media (prefers-reduced-motion:no-preference){.stampmark{animation:stamp .25s ease-out}}
@keyframes stamp{from{transform:rotate(-12deg) scale(1.4);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
@media print{header.top,.edit-only,.live{display:none!important}body{background:#fff}}
</style>

function startDate() { return new Date(D.event.startDate + "T" + (D.event.startTime || "00:00")); }

/* ---------- physics ---------- */
function powerAt(v, m, grade, cda) {
  const p = D.physics, th = Math.atan(grade);
  const F = m * 9.81 * (num(p.crr) * Math.cos(th) + Math.sin(th)) + 0.5 * num(p.rho) * cda * v * v;
  return v * F / (1 - num(p.drivetrainLossPct) / 100);
}
function solveV(P, m, grade, cda) {
  let lo = 0.3, hi = 30;
  if (powerAt(hi, m, grade, cda) < P) return hi;
  if (powerAt(lo, m, grade, cda) > P) return lo;
  for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (powerAt(mid, m, grade, cda) > P) hi = mid; else lo = mid; }
  return (lo + hi) / 2;
}
function riderPhys(r) {
  return { m: num(r.weightKg) + num(r.bikeKg), cda: (num(r.cda) || 0.35) * (1 - num(D.physics.draftPct) / 200) };
}
function pieces(d, gain, loss) {
  const p = D.physics;
  const gc = (num(p.climbGradePct) || 5) / 100, gd = (num(p.descentGradePct) || 5) / 100;
  const cd = Math.min(gain / gc / 1000, d * 0.6);
  const dd = Math.min(loss / gd / 1000, (d - cd) * 0.9);
  const out = [];
  if (cd > 0.001) out.push({ km: cd, g: gain / (cd * 1000), k: "climb" });
  if (dd > 0.001) out.push({ km: dd, g: -loss / (dd * 1000), k: "desc" });
  const fd = d - cd - dd; if (fd > 0.001) out.push({ km: fd, g: 0, k: "flat" });
  return out;
}
/* pair rides together: on each piece the slower rider sets the speed; each rider's power is what that speed costs them */
function segCalc(d, gain, loss, midKm) {
  const p = D.physics, R = D.riders;
  const fat = Math.max(0.6, 1 - num(p.fatiguePctPer100km) / 100 * midKm / 100);
  const cal = (num(p.calibrationPct) || 100) / 100;
  const ph = R.map(riderPhys);
  let tSec = 0; const kJ = R.map(() => 0);
  if (!R.length || d <= 0) return { tSec: 0, kJ };
  for (const pc of pieces(d, gain, loss)) {
    let v = Infinity;
    R.forEach((r, i) => {
      const pct = pc.k === "climb" ? r.pctClimb : pc.k === "desc" ? r.pctDescent : r.pctFlat;
      v = Math.min(v, solveV(num(r.ftpW) * num(pct) / 100 * fat, ph[i].m, pc.g, ph[i].cda));
    });
    if (pc.k === "desc") v = Math.min(v, (num(p.maxDescentKmh) || 50) / 3.6);
    const t = pc.km * 1000 / (v * cal);
    tSec += t;
    R.forEach((r, i) => { kJ[i] += Math.max(0, powerAt(v, ph[i].m, pc.g, ph[i].cda)) * t / 1000; });
  }
  return { tSec, kJ };
}
function kcalFromKJ(kj) { return kj / (4.184 * ((num(D.physics.efficiencyPct) || 23) / 100)); }

/* ---------- plan ---------- */
function stopType(id) { return D.stopTypes.find(s => s.id === id); }
function stopMinutes(c) { if (c.stopMin !== null && c.stopMin !== "" && c.stopMin !== undefined) return num(c.stopMin); const t = stopType(c.stopType); return t ? num(t.minutes) : 0; }
function plan() {
  const C = D.controls, N = D.nutrition, R = D.riders;
  const rows = []; let t = 0, ridingMin = 0, stopTot = 0, sleepTot = 0;
  const out = R.map(() => 0), inn = R.map(() => 0), bal = R.map(() => [[0, 0]]), cur = R.map(() => 0);
  C.forEach((c, i) => {
    let seg = null;
    if (i > 0) {
      const d = Math.max(0, num(c.km) - num(C[i - 1].km));
      const s = segCalc(d, num(c.gainM), num(c.lossM), (num(c.km) + num(C[i - 1].km)) / 2);
      const m = s.tSec / 60;
      seg = { d, min: m, speed: m > 0 ? d / (m / 60) : 0, kcal: s.kJ.map(kcalFromKJ) };
      R.forEach((r, ri) => {
        const o = seg.kcal[ri], ii = num(N.intakeKcalPerH) * m / 60;
        out[ri] += o; inn[ri] += ii; cur[ri] += ii - o; bal[ri].push([t + m, cur[ri]]);
      });
      t += m; ridingMin += m;
    }
    const planned = t;
    const hasActual = S.live[c.id] != null;
    if (hasActual) t = S.live[c.id];
    const last = i === C.length - 1;
    const stop = last || i === 0 ? 0 : stopMinutes(c);
    const sleep = last || i === 0 ? 0 : num(c.sleepMin);
    const close = (c.closeH === null || c.closeH === "" || c.closeH === undefined) ? null : num(c.closeH) * 60;
    R.forEach((r, ri) => {
      const o = (stop + sleep) * num(N.restKcalPerMin), ii = num(c.foodKcal);
      out[ri] += o; inn[ri] += ii; cur[ri] += ii - o; bal[ri].push([t + stop + sleep, cur[ri]]);
    });
    rows.push({ c, i, seg, planned, arr: t, hasActual, stop, sleep, dep: t + stop + sleep, close, buffer: close != null ? close - t : null, last });
    stopTot += stop; sleepTot += sleep;
    t += stop + sleep;
  });
  const finish = rows.length ? rows[rows.length - 1].arr : 0;
  return { rows, finish, ridingMin, stopTot, sleepTot, out, inn, bal, limit: num(D.event.timeLimitH) * 60 };
}
function sleepInfo(P) {
  const blocks = P.rows.filter(r => r.sleep > 0).map(r => ({ start: r.arr + r.stop, end: r.dep, r }));
  let wake = -num(D.sleep.awakeBeforeStartH) * 60, longest = 0;
  blocks.forEach(b => { longest = Math.max(longest, b.start - wake); wake = b.end; });
  longest = Math.max(longest, P.finish - wake);
  let night = 0;
  P.rows.forEach(r => { if (r.seg) { const s = r.arr - r.seg.min; for (let m = s; m < r.arr; m += 5) { const h = new Date(startDate().getTime() + m * 60000).getHours(); if (h >= 22 || h < 6) night += Math.min(5, r.arr - m); } } });
  return { blocks, longest, night };
}

function inp(path, type = "text", extra = "") {

  if (type === "lines") return `<textarea data-path="${path}" data-type="lines" ${extra}>${esc((v || []).join("\n"))}</textarea>`;
  const dt = type === "number" ? ' data-type="num" step="any" inputmode="decimal"' : "";

}

function importGPX(text, name) {

  const T = D.route.track; let from = 0, prev = null, worst = 0; const miss = [];

    let best = -1, bd = Infinity;
    for (let j = from; j < T.length; j++) { const d = hav([+c.lat, +c.lon], T[j]); if (d < bd) { bd = d; best = j; } if (bd < 0.5 && d > bd + 30) break; }

function lineChart(series, maxMin) {
  const W = 720, H = 240, L = 52, B = 26, T = 10, Rt = 10;
  const all = series.flatMap(s => s.pts.map(p => p[1])).concat([0]);
  let lo = Math.min(...all), hi = Math.max(...all); if (hi - lo < 100) hi = lo + 100;
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const xm = Math.max(60, maxMin);
  const x = m => L + (W - L - Rt) * m / xm, y = v => T + (H - T - B) * (hi - v) / (hi - lo);
  const cols = ["var(--ride)", "var(--stamp)", "var(--ok)"];
  let g = "";
  const step = Math.pow(10, Math.floor(Math.log10((hi - lo) / 4))) * (((hi - lo) / 4) / Math.pow(10, Math.floor(Math.log10((hi - lo) / 4))) > 5 ? 5 : ((hi - lo) / 4) / Math.pow(10, Math.floor(Math.log10((hi - lo) / 4))) > 2 ? 2 : 1);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) g += `<line x1="${L}" x2="${W - Rt}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v === 0 ? 'stroke-width="2"' : ""}/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`;
  for (let h = 0; h <= xm / 60; h += 10) g += `<text x="${x(h * 60)}" y="${H - 6}" text-anchor="middle">${h} h</text>`;
  const lines = series.map((s, i) => `<polyline fill="none" stroke="${cols[i % 3]}" stroke-width="2" points="${s.pts.map(p => x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1)).join(" ")}"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Energijska bilanca v kcal skozi čas">${g}${lines}</svg>
  <div class="legend">${series.map((s, i) => `<span><i style="background:${cols[i % 3]}"></i>${esc(s.name)}</span>`).join("")}<span>kcal, pod ničlo = primanjkljaj</span></div>`;
}

  <div class="box"><ul class="clean">${si.blocks.map(b => `<li><b>${esc(b.r.c.name)}</b> (${num(b.r.c.km)} km): ${clock(b.start)} do ${clock(b.end)}, ${dur(b.end - b.start)}. ${b.r.c.crew ? "V avtodomu." : '<span class="crew no">Brez avtodoma: spalnica kontrole.</span>'}</li>`).join("") || "<li>Ni načrtovanega spanja.</li>"}</ul></div>`;
};
function timeline(P) {
  const W = 720, H = 92, L = 22, Rt = 22, xm = Math.max(P.finish, num(D.event.timeLimitH) * 60);
  const x = m => L + (W - L - Rt) * m / xm;
  let g = "";
  for (let m = 0; m < xm; m += 30) { const h = new Date(startDate().getTime() + m * 60000).getHours(); if (h >= 22 || h < 6) g += `<rect x="${x(m)}" y="0" width="${x(m + 30) - x(m) + .5}" height="62" fill="var(--night)"/>`; }
  P.rows.forEach(r => {
    if (r.seg) g += `<rect x="${x(r.arr - r.seg.min)}" y="20" width="${Math.max(.5, x(r.arr) - x(r.arr - r.seg.min))}" height="22" fill="var(--ride)"/>`;
    if (r.stop) g += `<rect x="${x(r.arr)}" y="20" width="${x(r.arr + r.stop) - x(r.arr)}" height="22" fill="var(--stop)"/>`;
    if (r.sleep) g += `<rect x="${x(r.arr + r.stop)}" y="12" width="${x(r.dep) - x(r.arr + r.stop)}" height="38" fill="var(--sleep)"/>`;
  });
  g += `<line x1="${x(num(D.event.timeLimitH) * 60)}" x2="${x(num(D.event.timeLimitH) * 60)}" y1="0" y2="62" stroke="var(--stamp)" stroke-dasharray="3 3"/>`;
  for (let h = 0; h <= xm / 60; h += 10) g += `<text x="${x(h * 60)}" y="78" text-anchor="middle">${h} h</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Časovnica vožnje, postankov in spanja">${g}</svg>
  <div class="legend"><span><i style="background:var(--ride)"></i>vožnja</span><span><i style="background:var(--stop)"></i>postanek</span><span><i style="background:var(--sleep)"></i>spanje</span><span><i style="background:var(--night)"></i>noč 22–06</span><span>črtkano: limit</span></div>`;
}

function qualStatus() {

  q.pre = D.brevets.filter(b => num(b.season) === 2026 && b.status === "opravljen").sort((a, b) => num(b.distance) - num(a.distance))[0];
  return q;
}

const GH_KEY = "pbp-gh", DRAFT_KEY = "pbp-draft";
function ghCfg() {
  let c = {}; try { c = JSON.parse(localStorage.getItem(GH_KEY) || "{}"); } catch (e) {}
  if (!c.owner && /\.github\.io$/.test(location.hostname)) { c.owner = location.hostname.split(".")[0]; c.repo = c.repo || location.pathname.split("/")[1] || ""; }
  c.branch = c.branch || "main"; c.path = c.path || "pbp-data.json"; return c;
}
function b64(s) { const by = new TextEncoder().encode(s); let bin = ""; for (let i = 0; i < by.length; i += 0x8000) bin += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(bin); }
async function ghSave() {
  const c = ghCfg();
  if (!c.token || !c.owner || !c.repo) { S.tab = "podatki"; S.msg = "Najprej nastavi povezavo z GitHubom (uporabnik, repozitorij, žeton)."; render(); return; }
  S.saving = true; S.msg = ""; render();
  try {
    const api = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}`;
    const h = { Authorization: "Bearer " + c.token, Accept: "application/vnd.github+json" };
    const g = await fetch(api + "?ref=" + encodeURIComponent(c.branch), { headers: h, cache: "no-store" });
    let sha; if (g.ok) sha = (await g.json()).sha; else if (g.status !== 404) throw new Error(ghErr(g.status));
    const p = await fetch(api, { method: "PUT", headers: { ...h, "Content-Type": "application/json" },
      body: JSON.stringify({ message: "Posodobitev načrta " + new Date().toISOString().slice(0, 16).replace("T", " "), content: b64(JSON.stringify(D, null, 1)), branch: c.branch, sha }) });
    if (!p.ok) throw new Error(ghErr(p.status));
    S.dirty = false; saveDraft();
    S.msg = "Shranjeno na GitHub. Partner in ekipa bosta spremembe videla v približno minuti.";
  } catch (e) { S.msg = "Shranjevanje ni uspelo: " + e.message + " Podatki so varni v tem brskalniku."; }
  S.saving = false; render();
}
function ghErr(s) {
  return "HTTP " + s + (s === 401 ? ": žeton ni veljaven ali je potekel." : s === 403 || s === 404 ? ": žeton nima pravice Contents: write za ta repozitorij ali je ime repozitorija napačno." : s === 409 || s === 422 ? ": datoteka se je vmes spremenila, klikni še enkrat." : ".");
}
function saveDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ dirty: S.dirty, data: D })); } catch (e) {} }
function readDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch (e) { return null; } }

function markDirty() { S.dirty = true; D.meta = D.meta || {}; D.meta.updated = iso(new Date()); D.meta.savedAt = new Date().toISOString(); saveDraft(); }
function rerenderKeepFocus() {
  setTimeout(() => {
    const a = document.activeElement, ap = a && a.dataset ? (a.dataset.path || a.dataset.live) : null;
    const y = window.scrollY; render(); window.scrollTo(0, y);

  }, 0);

document.addEventListener("change", e => {
  const el = e.target;

    const id = el.dataset.live;
    if (el.value) S.live[id] = Math.round((new Date(el.value) - startDate()) / 60000); else delete S.live[id];
    saveLive(); rerenderKeepFocus(); return;
  }
  if (el.id === "placeSel") { S.placeCtl = el.value === "" ? null : +el.value; return; }
  if (!el.dataset.path) return;
  let v;
  if (el.dataset.type === "num") v = el.value === "" ? null : +el.value;
  else if (el.dataset.type === "bool") v = el.checked;
  else if (el.dataset.type === "lines") v = el.value.split("\n").map(s => s.trim()).filter(Boolean);
  else v = el.value;
  if (/\.season$/.test(el.dataset.path)) v = +v;
  setPath(el.dataset.path, v);
  markDirty(); rerenderKeepFocus();
});
